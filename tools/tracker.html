<div id="trackerTool">
  <style>
    #trackerTool {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--text-main);
      overflow: hidden;
    }

    #trackerHeader {
      padding: 16px;
      background: var(--glass-surface);
      backdrop-filter: blur(var(--glass-blur));
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    #trackerHeader h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--accent);
      margin: 0;
    }

    #trackerControls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .tracker-btn {
      width: auto; padding: 8px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      color: #e6fff5; border-radius: 999px; cursor: pointer;
      font: inherit; font-size: 0.85rem; transition: all 0.2s ease;
    }
    .tracker-btn:hover { border-color: rgba(44,255,179,0.45); background: rgba(44,255,179,0.08); }
    .tracker-btn.active { background: rgba(44,255,179,0.15); border-color: var(--accent); color: var(--accent); }
    .tracker-btn.primary {
      background: linear-gradient(130deg, rgba(44,255,179,0.24), rgba(44,255,179,0.11));
      border-color: rgba(44,255,179,0.45); color: #e6fff5; font-weight: 500;
    }
    .tracker-btn.primary:hover {
      background: linear-gradient(130deg, rgba(44,255,179,0.32), rgba(44,255,179,0.18));
      transform: translateY(-1px);
    }
    .tracker-btn.danger { border-color: rgba(255,107,107,0.4); color: #ff8c8c; }
    .tracker-btn.danger:hover { background: rgba(255,107,107,0.1); border-color: rgba(255,107,107,0.7); }
    .tracker-btn:disabled { cursor: not-allowed; opacity: 0.5; }
    .tracker-btn:disabled:hover { background: rgba(255,255,255,0.03); transform: none; }
    .tracker-sep { width: 1px; height: 20px; background: rgba(255,255,255,0.14); margin: 0 6px; }

    #trackerContent { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    #trackerPapers, #trackerStats { flex: 1; min-height: 0; overflow: auto; padding: 24px; }

    .tracker-page-head h2 { margin: 0 0 4px; font-size: 1.2rem; font-weight: 600; color: var(--accent); }
    .tracker-page-head p { margin: 0 0 16px; color: var(--text-muted); font-size: 0.85rem; }

    #trackerToolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
    #trackerToolbar > #trackerScope:first-child,
    #trackerToolbar > #trackerScope { margin-right: auto; }
    #trackerScope { white-space: nowrap; }
    .tracker-add-pill { margin-left: 14px; order: 99; }
    #trackerToolbar input[type="text"] {
      flex: 1; min-width: 200px; padding: 10px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12); font: inherit; font-size: 0.85rem;
      background: rgba(255,255,255,0.05); color: var(--text-main);
    }
    #trackerToolbar input[type="text"]:focus { outline: 2px solid var(--accent-soft); }
    #trackerResultCount { color: var(--text-muted); font-size: 0.85rem; }

    #trackerPaperGroups { display: flex; flex-direction: column; gap: 22px; }

    .tracker-subject-group h3 {
      margin: 0 0 10px; font-size: 1rem; font-weight: 600; color: var(--accent);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .tracker-subject-group .count {
      font-size: 0.78rem; color: var(--text-muted);
      background: rgba(44,255,179,0.1); border: 1px solid rgba(44,255,179,0.25);
      border-radius: 999px; padding: 2px 8px;
    }
    .tracker-subject-group .board-edit {
      font-size: 0.78rem; color: var(--text-muted); margin-left: auto; cursor: pointer;
      border: 1px dashed rgba(255,255,255,0.18); border-radius: 999px; padding: 2px 10px;
    }
    .tracker-subject-group .board-edit:hover { border-color: var(--accent-soft); color: var(--accent); }

    .tracker-sitting {
      background: linear-gradient(135deg, var(--panel-strong), var(--panel-bg));
      border: 1px solid var(--glass-border); border-radius: 16px;
      margin-bottom: 10px; overflow: hidden;
    }
    .tracker-sitting-head {
      display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer;
    }
    .tracker-sitting-head:hover { background: rgba(255,255,255,0.02); }
    .tracker-sitting-title { font-weight: 600; min-width: 0; }
    .tracker-sitting-title .series { color: var(--text-muted); font-weight: 400; font-size: 0.82rem; margin-left: 6px; }
    .tracker-sitting-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); color: var(--text-muted); }
    .tracker-sitting-badge.bnd { border-color: rgba(44,255,179,0.25); color: var(--accent); }
    .tracker-sitting-chev { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; min-height: 32px; margin-left: auto; padding: 4px 8px; border-radius: 7px; color: var(--text-muted); transition: transform 0.2s ease; }
    .tracker-sitting.open .tracker-sitting-chev { transform: rotate(0deg); }
    .head-scores { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.76rem; }
    .head-score {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      min-width: 84px; box-sizing: border-box; flex: 0 1 auto;
      padding: 3px 8px; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; background: rgba(255,255,255,0.03);
      white-space: nowrap;
    }
    .head-score .head-score-name { color: var(--text-muted); flex: 0 0 auto; }
    .head-score b { color: var(--accent); font-weight: 700; }
    .head-score b.low { color: #ff8c8c; }
    .head-score i { font-style: normal; color: var(--text-muted); }
    .head-score em { font-style: normal; color: var(--text-muted); }
    .head-score .head-grade {
      font-style: normal; display: inline-block; background: rgba(44,255,179,0.15);
      color: var(--accent); border-radius: 5px; padding: 1px 5px;
      font-size: 0.68rem; font-weight: 700; line-height: 1.3;
    }
    .head-grade { margin-top: 6px; display: inline-block; border-radius: 6px; padding: 2px 7px; font-size: 0.72rem; font-weight: 700; line-height: 1.4; }
    .head-grade.real { background: rgba(44,255,179,0.13); color: var(--accent); border: 1px solid rgba(44,255,179,0.4); }
    .head-grade.proj { background: rgba(255,196,0,0.12); color: #ffd166; border: 1px dashed rgba(255,196,0,0.45); }
    .head-grade.proj .proj-label { font-style: normal; font-size: 0.62rem; font-weight: 600; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.5px; }

    /* sitting table: fixed columns, collapsible note rows */
    .sit-table {
      width: 100%; border-collapse: separate; border-spacing: 0;
      background: linear-gradient(135deg, var(--panel-strong), var(--panel-bg));
      border: 1px solid var(--glass-border); border-radius: 14px; overflow: hidden; margin-top: 16px;
      font-size: 0.86rem;
    }
    .sit-table thead th {
      text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;
      color: var(--text-muted); padding: 10px 14px; border-bottom: 1px solid var(--glass-border);
      font-weight: 600; white-space: nowrap;
    }
    .sit-table tbody td {
      padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle;
    }
    .sit-table tbody tr:last-child td { border-bottom: none; }
    .sit-table tbody tr.row-main:hover { background: rgba(255,255,255,0.02); }
    .sit-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .col-session { width: 100px; }
    .col-papers { width: auto; }
    .col-boundary { min-width: 130px; white-space: normal; }
    .col-avg { width: 74px; text-align: center; }
    .col-actions { white-space: nowrap; text-align: right; }
    .sit-subject { color: var(--accent); font-weight: 600; }
    .sit-session { font-weight: 700; color: var(--text-main); white-space: nowrap; }
    .sit-session .series { color: var(--text-muted); font-weight: 400; font-size: 0.8rem; margin-left: 4px; }
    .sit-papers { display: flex; flex-wrap: wrap; gap: 6px; }
    .row-btn {
      background: none; border: none; color: var(--text-muted); font-size: 1.05rem; line-height: 1;
      padding: 6px; border-radius: 8px; cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .row-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }
    .row-btn.danger:hover { background: rgba(255,107,107,0.15); color: #ff8c8c; }
    .row-btn.note-toggle { opacity: 0.6; font-size: 1rem; }
    .row-btn.note-toggle.open { opacity: 1; color: var(--accent); }
    tr.note-row > td {
      padding: 0; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.025);
    }
    .note-inner { padding: 9px 16px 11px; font-size: 0.82rem; color: var(--text-muted); white-space: pre-line; line-height: 1.5; }
    .tracker-scope {
      font-size: 0.85rem; color: var(--text-muted); font-weight: 600;
    }
    .tracker-scope b { color: var(--text-main); }

    .tracker-empty { color: var(--text-muted); border: 1px dashed rgba(255,255,255,0.15); border-radius: 16px; padding: 32px; text-align: center; }
    .tracker-empty button { margin-top: 12px; }

    .tracker-stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 16px; }
    .tracker-stat-card {
      background: linear-gradient(135deg, var(--panel-strong), var(--panel-bg));
      border: 1px solid var(--glass-border); border-radius: 16px; padding: 16px;
    }
    .tracker-stat-card h4 { margin: 0 0 10px; font-size: 0.95rem; font-weight: 600; color: var(--accent); }
    .tracker-stat-card .stat { font-size: 1.5rem; font-weight: 700; }
    .tracker-stat-card .stat-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    .tracker-bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.08); margin-top: 10px; overflow: hidden; }
    .tracker-bar > div { height: 100%; background: linear-gradient(90deg, rgba(44,255,179,0.3), var(--accent)); border-radius: 999px; transition: width 0.3s ease; }
    .tracker-trend { margin-top: 10px; font-size: 0.78rem; color: var(--text-muted); line-height: 1.6; }

    #trackerModal { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 50; }
    #trackerModal.open { display: flex; }
    #trackerModalOverlay { position: absolute; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(2px); }
    #trackerModalBox {
      position: relative; width: min(560px, 92%); max-height: 86%; overflow: auto;
      background: linear-gradient(135deg, var(--panel-strong), #1a1a1a);
      border: 1px solid var(--glass-border); border-radius: 20px; padding: 22px; box-sizing: border-box;
    }
    #trackerModalTitle { margin: 0 0 16px; font-size: 1.15rem; font-weight: 600; color: var(--accent); }
    #trackerModalClose { position: absolute; top: 14px; right: 16px; background: none; border: none; color: var(--text-muted); font-size: 1.3rem; cursor: pointer; }
    #trackerModalClose:hover { color: var(--text-main); }

    .tracker-form-row { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
    .tracker-form-row label { font-size: 0.8rem; color: var(--text-muted); }
    .tracker-form-row input, .tracker-form-row select, .tracker-form-row textarea {
      padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12);
      font: inherit; font-size: 0.9rem; background: rgba(255,255,255,0.05); color: var(--text-main);
      width: 100%; box-sizing: border-box;
    }
    .tracker-form-row textarea { min-height: 60px; resize: vertical; }
    .tracker-form-row input:focus, .tracker-form-row select:focus, .tracker-form-row textarea:focus { outline: 2px solid var(--accent-soft); }
    .tracker-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }

    .tracker-slot-editor { border: 1px solid var(--glass-border); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; background: rgba(255,255,255,0.02); }
    .tracker-slot-editor .head { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px; gap: 10px; }
    .tracker-slot-paper {
      flex: 1; min-width: 0; padding: 8px 11px; border-radius: 9px; width: auto;
      border: 1px solid rgba(255,255,255,0.12); font: inherit; font-size: 0.9rem; font-weight: 600;
      background: rgba(255,255,255,0.05); color: var(--text-main); box-sizing: border-box;
    }
    .tracker-slot-paper:focus { outline: 2px solid var(--accent-soft); }
    .tracker-slot-editor .head .tracker-slot-paper { flex: 1; min-width: 0; }
    .tracker-att-list { display: flex; flex-direction: column; gap: 8px; }
    .tracker-slot-editor .attempt-row { display: flex; gap: 8px; align-items: center; }
    .tracker-slot-editor .attempt-row .tracker-att-score,
    .tracker-slot-editor .attempt-row .tracker-att-max,
    .tracker-slot-editor .attempt-row .tracker-att-date { min-width: 0; }
    .tracker-slot-editor .attempt-row .tracker-att-score { width: 100px; flex: none; }
    .tracker-slot-editor .attempt-row .tracker-att-max { width: 90px; flex: none; }
    .tracker-slot-editor .attempt-row .tracker-att-date { flex: 1; }
    .tracker-slot-editor .attempt-row input,
    .tracker-slot-editor .attempt-row label {
      padding: 9px 11px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.12);
      font: inherit; font-size: 0.86rem; background: rgba(255,255,255,0.05); color: var(--text-main); box-sizing: border-box;
    }
    .tracker-slot-editor .attempt-row label { background: transparent; border-color: transparent; padding: 0; font-weight: 600; color: var(--text-muted); }

    .tracker-form-actions { display: flex; gap: 10px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
    .tracker-form-msg { font-size: 0.85rem; margin-left: 6px; }
    .tracker-form-msg.ok { color: var(--accent); }
    .tracker-form-msg.err { color: #ff8c8c; }

    /* linked subject + auto grade boundaries */
    .tracker-muted-hint { font-weight: 400; opacity: 0.75; font-size: 0.75rem; }
    .tracker-course-state { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 30px; }
    .tracker-course-linked { font-size: 0.82rem; color: var(--accent); }
    .tracker-course-none { font-size: 0.82rem; color: var(--text-muted); }
    .tracker-course-picker { border: 1px solid var(--glass-border); border-radius: 12px; padding: 10px; margin-top: 8px; }
    .tracker-course-picker input { padding: 9px 11px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.12); font: inherit; font-size: 0.86rem; background: rgba(255,255,255,0.05); color: var(--text-main); width: 100%; box-sizing: border-box; }
    .tracker-course-picker input:focus { outline: 2px solid var(--accent-soft); }
    .tracker-course-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .tracker-chip {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
      color: var(--text-muted); border-radius: 999px; padding: 4px 12px;
      font: inherit; font-size: 0.74rem; cursor: pointer; transition: all 0.15s ease;
    }
    .tracker-chip:hover { border-color: var(--accent-soft); color: var(--accent); }
    .tracker-chip.active { background: rgba(44,255,179,0.15); border-color: var(--accent); color: var(--accent); }
    .bnd-auto-chip { font-style: normal; font-size: 0.7rem; color: var(--accent); opacity: 0.85; margin-left: 3px; font-weight: 600; }
    /* Remove paper — a boxy remove that reads as a destructive action */
    .tracker-slot-del {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,107,107,0.35);
      color: #ff8c8c; border-radius: 9px; padding: 6px 14px;
      font: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; flex: none;
      transition: all 0.15s ease;
    }
    .tracker-slot-del:hover { border-color: #ff6b6b; color: #ffb3b3; background: rgba(255,107,107,0.15); }
    .tracker-slot-del:disabled { opacity: 0.4; cursor: not-allowed; }
    /* Remove attempt — a boxy button matching the input field height so it stays aligned */
    .tracker-att-del {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,107,107,0.35);
      color: var(--text-muted); width: 38px; height: 38px; flex: none; box-sizing: border-box;
      border-radius: 9px; font-size: 1.15rem; line-height: 1; cursor: pointer;
      transition: all 0.15s ease;
    }
    .tracker-att-del:hover { border-color: #ff6b6b; color: #ffb3b3; background: rgba(255,107,107,0.15); }
    .tracker-att-del:disabled { opacity: 0.4; cursor: not-allowed; }
    /* + Attempt add: compact pill, visually joined to the attempt list with top spacing — pills are for
       quick/adjacent actions only, kept visually distinct from the boxy remove buttons */
    .tracker-att-add {
      background: rgba(255,255,255,0.06); border: 1px dashed rgba(255,255,255,0.25);
      color: var(--accent); border-radius: 999px; padding: 5px 13px;
      font: inherit; font-size: 0.78rem; font-weight: 600; cursor: pointer; margin-top: 10px;
      transition: all 0.15s ease;
    }
    .tracker-att-add:hover { border-color: var(--accent); background: rgba(44,255,179,0.1); }
    .tracker-slot-add {
      align-self: flex-start; margin-top: 6px;
      background: rgba(44,255,179,0.08); border: 1px solid rgba(44,255,179,0.35);
      color: var(--accent); border-radius: 999px; padding: 7px 15px;
      font: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer;
      transition: all 0.15s ease;
    }
    .tracker-slot-add:hover { background: rgba(44,255,179,0.14); border-color: var(--accent); }
    .tracker-course-list { max-height: 230px; overflow: auto; margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .tracker-course-board { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin: 8px 0 2px; }
    .tracker-course-item {
      text-align: left; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-main); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 0.82rem; cursor: pointer;
    }
    .tracker-course-item:hover { border-color: var(--accent-soft); background: rgba(44,255,179,0.07); }
    .tracker-course-item.sel { border-color: var(--accent); color: var(--accent); }
    .tracker-course-item .course-qual { color: var(--text-muted); font-size: 0.75rem; }
    .tracker-course-item .course-code { color: var(--accent); font-weight: 600; }
    .tracker-course-empty { font-size: 0.8rem; color: var(--text-muted); padding: 8px 4px; line-height: 1.5; }
    .tracker-boundary-hint { font-size: 0.72rem; color: var(--text-muted); line-height: 1.5; display: block; }
    .tracker-boundary-hint .bnd-auto { color: var(--accent); font-weight: 600; }
    .tracker-bounds { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; max-width: 250px; line-height: 1.4; }

    @media (max-width: 700px), (pointer: coarse) and (hover: none) {
      #trackerTool,
      #trackerContent { min-height: 0; min-width: 0; }
      #trackerHeader { flex-direction: column; align-items: stretch; padding: 12px; }
      #trackerControls { justify-content: flex-start; }
      #trackerPapers, #trackerStats { padding: 14px 12px; }
      #trackerToolbar input[type="text"] { min-width: 0; flex-basis: 100%; }
      #trackerToolbar button, #trackerToolbar .tracker-btn { flex: 1 1 auto; }
      #trackerScope, #trackerResultCount { width: 100%; }
      .tracker-sitting-head { flex-wrap: wrap; padding: 11px 12px; }
      .head-scores { width: 100%; }
      .sit-table { min-width: 620px; }
      .tracker-form-grid { grid-template-columns: 1fr; }
      #trackerModalBox { padding: 16px; width: min(94%, 560px); max-height: calc(100dvh - 24px); }
    }
  </style>

  <div id="trackerHeader">
    <h1>Past Papers <span class="tool-reference" title="Tracker tool"><i class="fa-solid fa-chart-column" aria-hidden="true"></i><code>Tracker</code></span></h1>
    <div id="trackerControls">
      <button id="trackerPapersBtn" class="tracker-btn active">Papers</button>
      <button id="trackerStatsBtn" class="tracker-btn">Stats</button>
      <span class="tracker-sep"></span>
      <button id="trackerExportBtn" class="tracker-btn">Export</button>
      <button id="trackerImportBtn" class="tracker-btn">Import</button>
      <input id="trackerImportFile" type="file" accept=".json" style="display:none;" />
    </div>
  </div>

  <div id="trackerContent">
    <div id="trackerPapers">
      <div class="tracker-page-head">
        <h2>Papers</h2>
        <p>Each entry is one sitting (a paper taken in a given year &amp; series), with per-paper scores and retakes. Set the exam board once per subject.</p>
      </div>
      <div id="trackerToolbar">
        <datalist id="trackerSubjectList"></datalist>
        <span id="trackerScope"></span>
        <span id="trackerResultCount"></span>
        <button id="trackerDropBtn" class="tracker-btn" title="Expand all sitting notes">Expand all</button>
        <button id="trackerCollapseBtn" class="tracker-btn" title="Collapse all sitting notes">Collapse all</button>
        <button id="trackerAddBtn" class="tracker-btn primary tracker-add-pill">+ Add sitting</button>
      </div>
      <div id="trackerPaperGroups"></div>
    </div>

    <div id="trackerStats" style="display:none;">
      <div class="tracker-page-head">
        <h2>Progress</h2>
        <p>Best, average &amp; latest per subject.</p>
      </div>
      <div id="trackerStatsGrid" class="tracker-stats-grid"></div>
    </div>
  </div>

  <div id="trackerModal">
    <div id="trackerModalOverlay"></div>
    <div id="trackerModalBox">
      <button id="trackerModalClose" title="Close">&times;</button>
      <h2 id="trackerModalTitle">Add sitting</h2>
      <div class="tracker-form-grid">
        <div class="tracker-form-row">
          <label>Subject</label>
          <input id="trackerFormSubject" list="trackerSubjectList" placeholder="e.g. Maths" />
        </div>
        <div class="tracker-form-row">
          <label>Qualification</label>
          <select id="trackerFormQualification">
            <option value="">--</option>
            <option value="GCSE">GCSE</option>
            <option value="A-Level">A-Level</option>
          </select>
        </div>
        <div class="tracker-form-row">
          <label>Exam board (per subject)</label>
          <input id="trackerFormBoard" list="trackerBoardList" placeholder="e.g. AQA" />
          <datalist id="trackerBoardList">
            <option value="AQA"></option><option value="Edexcel"></option><option value="OCR"></option>
            <option value="WJEC"></option><option value="CCEA"></option><option value="Cambridge"></option>
          </datalist>
        </div>
        <div class="tracker-form-row">
          <label>Year</label>
          <input id="trackerFormYear" type="number" placeholder="2024" />
        </div>
        <div class="tracker-form-row">
          <label>Series (optional)</label>
          <select id="trackerFormSeries">
            <option value="">--</option>
            <option value="June">June</option>
            <option value="November">November</option>
            <option value="March">March</option>
            <option value="May">May</option>
            <option value="October">October</option>
            <option value="Mock">Mock</option>
            <option value="Specimen">Specimen</option>
          </select>
        </div>
        <div class="tracker-form-row">
          <label>Boundary for top grade (this sitting)</label>
          <input id="trackerFormBoundary" type="number" placeholder="e.g. 132" />
          <span id="trackerBoundaryHint" class="tracker-boundary-hint"></span>
        </div>
      </div>
      <div class="tracker-form-row">
        <label>Linked subject <span class="tracker-muted-hint">— auto grade boundaries when cached</span></label>
        <div id="trackerCourseState" class="tracker-course-state"></div>
        <div id="trackerCoursePicker" class="tracker-course-picker" hidden>
          <input id="trackerCourseFilter" type="text" placeholder="Search subjects, codes, AQA/OCR/Pearson, GCSE/A-Level..." />
          <div id="trackerCourseFilters" class="tracker-course-filters">
            <button type="button" class="tracker-chip active" data-f="">All</button>
            <button type="button" class="tracker-chip" data-f="gcse">GCSE</button>
            <button type="button" class="tracker-chip" data-f="alevel">A-Level</button>
            <button type="button" class="tracker-chip" data-f="aqa">AQA</button>
            <button type="button" class="tracker-chip" data-f="ocr">OCR</button>
            <button type="button" class="tracker-chip" data-f="pearson">Pearson</button>
          </div>
          <div id="trackerCourseList" class="tracker-course-list"></div>
        </div>
      </div>
      <div class="tracker-form-row">
        <label>Paper scores (per-paper; add attempts for retakes)</label>
        <div id="trackerSlotList"></div>
        <button type="button" id="trackerAddSlotBtn" class="tracker-slot-add">+ Add paper slot</button>
      </div>
      <div class="tracker-form-row">
        <label>Notes</label>
        <textarea id="trackerFormNotes" placeholder="Optional notes..."></textarea>
      </div>
      <div class="tracker-form-actions">
        <button id="trackerSaveBtn" class="tracker-btn primary">Save sitting</button>
        <button id="trackerCancelBtn" class="tracker-btn">Cancel</button>
        <span id="trackerFormMsg" class="tracker-form-msg"></span>
      </div>
    </div>
  </div>
</div>
