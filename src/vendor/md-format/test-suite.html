<!doctype html>
<meta charset="utf-8">
<title>md-format vendor regression suite</title>
<link rel="stylesheet" href="./mdeditor.css">
<style>
  body { margin: 0; background: #111; color: #eee; font: 14px system-ui; }
  #results { white-space: pre-wrap; padding: 16px; }
  #fixture { position: fixed; left: -10000px; top: 0; width: 900px; height: 500px; }
</style>
<div id="results">running…</div><div id="fixture"></div>
<script type="module">
import { createEditor, parse, render, domToMarkdown } from "./mdeditor.js";

const results = [];
function test(name, fn) {
  try { fn(); results.push({ name, ok: true }); }
  catch (error) { results.push({ name, ok: false, error: String(error?.stack || error) }); }
}
function equal(actual, expected, message = "") {
  if (actual !== expected) throw new Error(`${message} expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
}
function includes(actual, expected, message = "") {
  if (!String(actual).includes(expected)) throw new Error(`${message} missing ${JSON.stringify(expected)} in ${JSON.stringify(actual)}`);
}
function truthy(value, message = "expected a truthy value") { if (!value) throw new Error(message); }

const cases = [
  ["empty", ""],
  ["unicode", "# Café 🚀\n\nAccents: naïve — 東京"],
  ["realistic notes", "# Launch notes\n\n## Decisions\n\n- [x] Keep the source of truth in markdown\n- [ ] Add import validation\n\n> Ship the smallest reliable editor.\n\nSee [the guide](https://example.com/docs)."],
  ["nested blocks", "> quote\n>\n> - nested item\n> - second item\n\n1. first\n2. second"],
  ["code and tables", "```js\nconst answer = 42;\n```\n\n| Name | Value |\n| :--- | ---: |\n| x | 1 |"],
  ["math and escapes", "Inline $x^2$ and $$\\sum_{i=0}^n i$$\n\n\\*literal asterisk\\* & <tag>"],
  ["messy input", "\r\n\r\n  leading spaces\r\n\r\n\r\ntrailing\r\n"],
];

for (const [name, source] of cases) {
  test(`parse/render does not throw: ${name}`, () => {
    const ast = parse(source);
    truthy(ast && Array.isArray(ast.children));
    const html = render(ast, "html");
    truthy(typeof html === "string");
    truthy(typeof render(ast, "markdown") === "string");
    truthy(typeof render(ast, "text") === "string");
  });
}

test("headings, links, emphasis, lists and code render semantically", () => {
  const html = render(parse("# Heading\n\n**bold** *italic* `code`\n\n- one\n- two\n\n[link](https://example.com)"), "html");
  includes(html, "<h1>"); includes(html, "<strong>"); includes(html, "<em>");
  includes(html, "<code>"); includes(html, "<ul>"); includes(html, "href=\"https://example.com\"");
});

test("strict markdown keeps a single newline in one paragraph", () => {
  const html = render(parse("one\ntwo"), "html");
  equal((html.match(/<br\s*\/?\s*>/g) || []).length, 0, "strict line break");
  includes(html, "one"); includes(html, "two");
});

test("word-style mode renders single and repeated blank lines", () => {
  const html = render(parse("one\ntwo\n\n\nthree"), "html", { softBreaks: true });
  includes(html, "one<br"); includes(html, "md-blank-line");
  equal((html.match(/data-md-blank-line/g) || []).length, 1, "one extra blank line");
});

test("strict mode does not emit word-style blank-line markers", () => {
  const html = render(parse("one\n\n\nthree"), "html");
  equal((html.match(/data-md-blank-line/g) || []).length, 0);
});

test("task list checkboxes are enabled in rendered editor HTML", () => {
  const html = render(parse("- [x] done\n- [ ] next"), "html");
  includes(html, 'type="checkbox"'); includes(html, 'checked');
});

test("editor starts in requested visual view and exposes one taskbar", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { value: "# Hello", view: "preview", storage: false, softBreaks: true, toolbar: ["bold"] });
  equal(ed.getView(), "preview"); equal(host.querySelectorAll(".mdedit-bar").length, 1);
  equal(host.querySelectorAll("[data-view]").length, 3); equal(host.querySelectorAll("[data-soft-break]").length, 2);
  equal(host.querySelector('[data-view="preview"]').getAttribute("aria-pressed"), "true");
  equal(host.querySelector('[data-soft-break="1"]').getAttribute("aria-pressed"), "true");
  ed.destroy();
});

test("taskbar view clicks update the vendor state and panes", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { value: "hello", view: "preview", storage: false });
  host.querySelector('[data-view="md"]').click();
  equal(ed.getView(), "md"); truthy(host.querySelector(".mdedit-editor"));
  equal(host.querySelector('[data-view="md"]').getAttribute("aria-pressed"), "true");
  truthy(host.querySelector(".mdedit-pane.gone"));
  host.querySelector('[data-view="split"]').click(); equal(ed.getView(), "split");
  equal(host.querySelector('[data-view="split"]').getAttribute("aria-pressed"), "true");
  ed.destroy();
});

test("taskbar line-break clicks update rendering and state", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { value: "one\ntwo", view: "preview", storage: false, softBreaks: false });
  host.querySelector('[data-soft-break="1"]').click();
  equal(ed.getSoftBreaks(), true); includes(host.querySelector(".md").innerHTML, "<br");
  equal(host.querySelector('[data-soft-break="1"]').getAttribute("aria-pressed"), "true");
  host.querySelector('[data-soft-break="0"]').click(); equal(ed.getSoftBreaks(), false);
  equal(host.querySelector('[data-soft-break="0"]').getAttribute("aria-pressed"), "true");
  ed.destroy();
});

test("setView and setSoftBreaks keep taskbar synchronized", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { storage: false });
  ed.setView("md").setSoftBreaks(true);
  equal(host.querySelector('[data-view="md"]').getAttribute("aria-pressed"), "true");
  equal(host.querySelector('[data-soft-break="1"]').getAttribute("aria-pressed"), "true");
  ed.setView("preview").setSoftBreaks(false);
  equal(host.querySelector('[data-view="preview"]').getAttribute("aria-pressed"), "true");
  equal(host.querySelector('[data-soft-break="0"]').getAttribute("aria-pressed"), "true");
  ed.destroy();
});

test("markdown source survives editor set/get round trip", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const source = "# Title\n\nA **real** paragraph.\n\n- one\n- two";
  const ed = createEditor(host, { storage: false, view: "preview", softBreaks: true });
  ed.setMarkdown(source); equal(ed.getMarkdown(), source); ed.destroy();
});

test("DOM serializer preserves repeated word-style blank lines", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const source = "one\n\n\nthree";
  const ed = createEditor(host, { value: source, storage: false, view: "preview", softBreaks: true });
  const folded = domToMarkdown(host.querySelector(".md"));
  equal(folded, source); ed.destroy();
});

test("editor formatting commands mutate the source predictably", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { value: "hello", storage: false, view: "md", toolbar: false });
  ed.editor.setSelectionRange(0, 5); ed.command("bold"); equal(ed.getMarkdown(), "**hello**");
  ed.editor.setSelectionRange(0, 9); ed.command("italic"); equal(ed.getMarkdown(), "***hello***");
  ed.destroy();
});

test("collapsed Bold and Italic format the current line", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { value: "first line\nsecond line", storage: false, view: "md", toolbar: false });
  ed.editor.setSelectionRange(4, 4); ed.command("bold"); equal(ed.getMarkdown(), "**first line**\nsecond line");
  ed.editor.setSelectionRange(15, 15); ed.command("italic"); equal(ed.getMarkdown(), "**first line**\n*second line*");
  ed.editor.setSelectionRange(4, 4); ed.command("bold"); equal(ed.getMarkdown(), "first line\n*second line*");
  ed.destroy();
});

test("collapsed inline formatting preserves list markers and blank lines", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { value: "- item\n\n", storage: false, view: "md", toolbar: false });
  ed.editor.setSelectionRange(3, 3); ed.command("bold"); equal(ed.getMarkdown(), "- **item**\n\n");
  ed.editor.setSelectionRange(ed.editor.value.length, ed.editor.value.length); ed.command("italic"); equal(ed.getMarkdown(), "- **item**\n\n**");
  ed.destroy();
});

test("Bold, Italic, and Strike compose and toggle independently", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { value: "word", storage: false, view: "md", toolbar: false });
  ed.editor.setSelectionRange(0, 4); ed.command("italic"); equal(ed.getMarkdown(), "*word*");
  ed.editor.setSelectionRange(1, 5); ed.command("bold"); equal(ed.getMarkdown(), "***word***");
  ed.editor.setSelectionRange(3, 7); ed.command("strike"); equal(ed.getMarkdown(), "***~~word~~***");
  ed.editor.setSelectionRange(5, 9); ed.command("strike"); equal(ed.getMarkdown(), "***word***");
  ed.editor.setSelectionRange(3, 7); ed.command("bold"); equal(ed.getMarkdown(), "*word*");
  ed.editor.setSelectionRange(1, 5); ed.command("italic"); equal(ed.getMarkdown(), "word");
  ed.destroy();
});

test("collapsed Strike formats and toggles the current line", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { value: "erase this", storage: false, view: "md", toolbar: false });
  ed.editor.setSelectionRange(3, 3); ed.command("strike"); equal(ed.getMarkdown(), "~~erase this~~");
  ed.editor.setSelectionRange(3, 3); ed.command("strike"); equal(ed.getMarkdown(), "erase this"); ed.destroy();
});

test("collapsed Inline code formats the current line", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { value: "const answer = 42;", storage: false, view: "md" });
  ed.editor.setSelectionRange(6, 6); ed.command("code"); equal(ed.getMarkdown(), "`const answer = 42;`");
  ed.editor.setSelectionRange(6, 6); ed.command("code"); equal(ed.getMarkdown(), "const answer = 42;"); ed.destroy();
});

test("undo and redo buttons restore editor content", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { value: "one", storage: false, view: "md" });
  ed.setMarkdown("two"); ed.setMarkdown("three");
  const undoButton = host.querySelector('[data-history="undo"]');
  const redoButton = host.querySelector('[data-history="redo"]');
  truthy(!undoButton.disabled); undoButton.click(); equal(ed.getMarkdown(), "two");
  redoButton.click(); equal(ed.getMarkdown(), "three"); ed.destroy();
});

test("Ctrl/Cmd-Z, Ctrl/Cmd-Y and Shift-Z use the same history", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { value: "start", storage: false, view: "md" });
  ed.setMarkdown("changed");
  ed.editor.dispatchEvent(new KeyboardEvent("keydown", { key: "z", ctrlKey: true, bubbles: true }));
  equal(ed.getMarkdown(), "start");
  ed.editor.dispatchEvent(new KeyboardEvent("keydown", { key: "y", ctrlKey: true, bubbles: true }));
  equal(ed.getMarkdown(), "changed");
  ed.editor.dispatchEvent(new KeyboardEvent("keydown", { key: "z", ctrlKey: true, shiftKey: true, bubbles: true }));
  equal(ed.getMarkdown(), "changed"); ed.destroy();
});

test("block prefixes stay outside collapsed inline formatting", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { value: "quoted line\nstruck line", storage: false, view: "md", toolbar: false });
  ed.editor.setSelectionRange(4, 4); ed.command("italic");
  ed.editor.setSelectionRange(4, 4); ed.command("quote"); equal(ed.getMarkdown(), "> *quoted line*\nstruck line");
  ed.editor.setSelectionRange(21, 21); ed.command("strike");
  ed.editor.setSelectionRange(21, 21); ed.command("quote"); equal(ed.getMarkdown(), "> *quoted line*\n> ~~struck line~~");
  ed.editor.setSelectionRange(4, 4); ed.command("quote"); equal(ed.getMarkdown(), "*quoted line*\n> ~~struck line~~");
  ed.destroy();
});

test("inline code and fenced code block actions are distinct", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { value: "code", storage: false, view: "md" });
  equal(host.querySelector('[data-tool="code"]').textContent, "Inline code");
  equal(host.querySelector('[data-tool="codeblock"]').textContent, "Code block");
  ed.destroy();
});

test("toolbar false still provides the vendor taskbar", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { storage: false, toolbar: false, taskbar: true });
  equal(host.querySelectorAll(".tbtn").length, 0); equal(host.querySelectorAll(".mdedit-actions").length, 1); ed.destroy();
});

test("taskbar can be disabled for a deliberately chrome-free embed", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { storage: false, toolbar: false, taskbar: false });
  equal(host.querySelectorAll(".mdedit-bar").length, 0); equal(host.querySelectorAll("[data-view]").length, 0); ed.destroy();
});

test("invalid view and output requests are harmless", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { storage: false, view: "not-a-view", output: "not-an-output" });
  equal(ed.getView(), "split"); equal(ed.getOutput(), "html"); ed.setView("nope"); ed.setOutput("nope");
  equal(ed.getView(), "split"); equal(ed.getOutput(), "html"); ed.destroy();
});

test("soft-break callback fires only for persisted changes", () => {
  const calls = [];
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { storage: false, onSoftBreaksChange: value => calls.push(value) });
  ed.setSoftBreaks(true, { persist: false }); equal(calls.length, 0);
  ed.setSoftBreaks(false); equal(calls.length, 1); equal(calls[0], false); ed.destroy();
});

test("HTML-sensitive input follows the renderer's explicit HTML policy", () => {
  const html = render(parse("<" + "script>alert(1)</" + "script> & safe"), "html");
  truthy(html.includes("script")); truthy(typeof html === "string");
});

test("output modes return usable strings", () => {
  const ast = parse("# hi\n\ntext");
  for (const mode of ["html", "text", "ansi", "markdown"]) {
    const value = render(ast, mode); truthy(typeof value === "string", mode); truthy(value.length > 0, mode);
  }
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { storage: false, output: "htmlsrc" });
  truthy(host.querySelector("pre.source")); ed.setOutput("ast"); truthy(host.querySelector("pre.source")); ed.destroy();
});

test("editor destroy removes all owned DOM", () => {
  const host = document.createElement("div"); document.querySelector("#fixture").append(host);
  const ed = createEditor(host, { value: "owned", storage: false }); ed.destroy();
  equal(host.children.length, 0); equal(host.classList.contains("mdedit"), false);
});

const failed = results.filter(result => !result.ok);
document.querySelector("#results").textContent = `${failed.length ? "FAIL" : "PASS"} — ${results.length - failed.length}/${results.length} tests passed\n` +
  results.map(result => `${result.ok ? "✓" : "✗"} ${result.name}${result.error ? `\n  ${result.error}` : ""}`).join("\n");
document.body.dataset.status = failed.length ? "fail" : "pass";
if (failed.length) console.error(failed);
</script>
